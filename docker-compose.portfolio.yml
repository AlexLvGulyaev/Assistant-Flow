# =============================================================================
# Portfolio / GitHub demo — без external networks, без n8n/Traefik.
#
# Ожидаемый сценарий:
#   cp .env.example .env
#   docker compose -f docker-compose.portfolio.yml up -d --build --remove-orphans
#
# Порты на хосте (по умолчанию):
#   5433  — PostgreSQL (5433 снаружи → 5432 внутри сети; иначе конфликт с локальным Postgres)
#   8001  — Chroma HTTP (8001 снаружи → 8000 в контейнере; меньше конфликтов с другими Chroma)
#   8600  — FastAPI Admin API
#   8080  — React admin UI (статика через nginx после vite build в образе)
#   8089  — Weaviate HTTP (хост → 8080 в контейнере weaviate; не пересекается с admin-ui)
#
# PostgreSQL: при первом создании volume автоматически выполняются SQL из
# docker-entrypoint-initdb.d (schema + async_jobs). Если volume уже был без
# init — удалите volume или примените SQL вручную (docs/OPERATIONS.md).
#
# Telegram: при TELEGRAM_BOT_TOKEN из .env.example (placeholder) контейнер
# assistant-flow не падает — ждёт реальный токен (см. interfaces/telegram_bot.py).
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant_flow
    volumes:
      - portfolio_pg_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/migrations/004_async_jobs_foundation.sql:/docker-entrypoint-initdb.d/02_async_jobs.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant_flow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  chroma:
    image: chromadb/chroma:1.0.15
    ports:
      - "8001:8000"
    volumes:
      - portfolio_chroma_data:/data
    # Образ может не содержать инструментов для Docker healthcheck — как в server compose.

  weaviate:
    image: semitechnologies/weaviate:1.27.0
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --scheme
      - http
    environment:
      QUERY_DEFAULTS_LIMIT: "100"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
    ports:
      - "8089:8080"
    volumes:
      - portfolio_weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

  assistant-flow:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    volumes:
      - ./data/documents:/app/data/documents
      - ./outputs:/app/outputs
      - ./storage:/app/storage
    command: ["python", "run_telegram_bot.py"]
    restart: unless-stopped

  admin-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_RAGAS: "true"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    ports:
      - "8600:8600"
    volumes:
      - ./data/documents:/app/data/documents
      - ./outputs:/app/outputs
      - ./storage:/app/storage
    command: ["python", "run_admin_api.py"]
    # Heavy RAG safeguard: Docker видит деградацию admin-api (healthcheck бьёт
    # лёгкий /api/health: PG + retrieval readiness, без LLM-вызовов).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8600/api/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  # React: production-сборка (Vite) внутри образа + nginx для статики.
  # API — тот же origin: nginx контейнера проксирует /api/ в admin-api,
  # VITE_ADMIN_API_BASE_URL пуст → UI ходит по относительным /api.
  # Пустой build-arg обязателен для субдомена af-admin.alex-n8n.site
  # (за traefik захардкоженный localhost:8600 из браузера недостижим).
  admin-ui:
    build:
      context: ./frontend/admin-ui
      dockerfile: Dockerfile
      args:
        VITE_ADMIN_API_BASE_URL: ""
        # Демо-стандарт APL: демо-токен запекается в бандл для кнопки
        # «Войти в демо-режиме» (RF-схема VITE_OPS_DEMO_TOKEN).
        VITE_OPS_DEMO_TOKEN: ${AF_ADMIN_DEMO_TOKEN:-}
    ports:
      - "8080:80"
    depends_on:
      - admin-api
    restart: unless-stopped
    networks:
      # На n8n_default нужен уникальный alias: у LQ-админки сервис тоже
      # называется admin-ui, и без явного alias Docker DNS отвечает
      # round-robin между двумя контейнерами (страницы консолей перемешиваются).
      default: {}
      n8n_default:
        aliases:
          - assistant-flow-admin-ui

networks:
  n8n_default:
    external: true

volumes:
  portfolio_pg_data:
  portfolio_chroma_data:
  portfolio_weaviate_data:
