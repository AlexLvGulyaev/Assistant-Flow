# =============================================================================
# Portfolio / GitHub demo — без external networks, без n8n/Traefik.
#
# Ожидаемый сценарий:
#   cp .env.example .env
#   # заполнить TELEGRAM_BOT_TOKEN и ключи провайдеров
#   docker compose -f docker-compose.portfolio.yml up -d --build
#
# Порты на хосте (по умолчанию):
#   5432  — PostgreSQL
#   8000  — Chroma HTTP
#   8600  — FastAPI Admin API
#   8080  — React admin UI (статика через nginx после vite build в образе)
#
# Перед первым запуском с полным функционалом БД примените схему:
#   database/schema.sql (и при необходимости migrations/) — см. docs/OPERATIONS.md
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant_flow
    volumes:
      - portfolio_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant_flow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  chroma:
    image: chromadb/chroma:1.0.15
    ports:
      - "8000:8000"
    volumes:
      - portfolio_chroma_data:/data
    # Образ может не содержать инструментов для Docker healthcheck — как в server compose.

  assistant-flow:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    volumes:
      - ./data/documents:/app/data/documents
      - ./outputs:/app/outputs
      - ./storage:/app/storage
    command: ["python", "run_telegram_bot.py"]
    restart: unless-stopped

  admin-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    ports:
      - "8600:8600"
    volumes:
      - ./data/documents:/app/data/documents
      - ./outputs:/app/outputs
      - ./storage:/app/storage
    command: ["python", "run_admin_api.py"]
    restart: unless-stopped

  # React: production-сборка (Vite) внутри образа + nginx для статики.
  # Сборочный аргумент VITE_ADMIN_API_BASE_URL задаёт URL API с точки зрения браузера на хосте.
  admin-ui:
    build:
      context: ./frontend/admin-ui
      dockerfile: Dockerfile
      args:
        VITE_ADMIN_API_BASE_URL: http://localhost:8600
    ports:
      - "8080:80"
    depends_on:
      - admin-api
    restart: unless-stopped

volumes:
  portfolio_pg_data:
  portfolio_chroma_data:
