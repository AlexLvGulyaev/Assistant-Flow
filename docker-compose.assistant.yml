services:
  # Chroma healthcheck is diagnostic-only.
  # assistant-flow must still boot in degraded mode when Chroma is unavailable.
  assistant-chroma:
    image: chromadb/chroma:1.0.15
    container_name: assistant-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - assistant_chroma_data:/data

    # Chroma index is persisted in assistant_chroma_data volume.
    # Do not remove this volume unless full reindex is intended.
    # NOTE:
    # chromadb/chroma:1.0.15 may not contain python/curl/wget binaries in all builds.
    # To avoid false-negative/unhealthy loops from missing shell tools, docker-level
    # healthcheck is intentionally disabled here.
    # Chroma availability is checked on app-level via services/healthcheck_service.py
    # (heartbeat + client heartbeat + collection count with timeout).
    networks:
      - assistant-net
      - n8n_default

  assistant-flow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assistant-flow
    restart: unless-stopped
    env_file:
      - .env.server
    volumes:
      - ./data/documents:/app/data/documents
      - ./outputs:/app/outputs
      # AssetRepository persistent storage. Do not remove unless full asset reset is intended.
      - ./storage:/app/storage
    networks:
      - assistant-net
      - n8n_default

networks:
  assistant-net:
    external: true
  n8n_default:
    external: true

volumes:
  assistant_chroma_data:
  